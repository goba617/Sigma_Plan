<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="che.css">
  </head>
  <body>
    <div class="title">
      <h1>工作表</h1>
    </div>
    <button id="addEventBtn" >新增事件+</button>
    <div class="modal" id="enterEvent">
      <div class="modal-box">
        <input type="text" placeholder="輸入標題" id="eventTitle">
        <textarea placeholder="輸入內容" id="eventContent"></textarea>
        <button id="saveEventBtn">儲存</button>
        <button id="leaveEventBtn">離開</button>
      </div>
    </div>
    <div class="modal" id="changeinfo-modal">
      <div class="modal-box">
        <input type="text" placeholder="輸入標題" id="changeinfoTitle">
        <textarea placeholder="輸入內容" id="changeinfoContent"></textarea>
        <textarea placeholder="輸入補充內容" id="moreinfoContent"></textarea>
        <button id="saveChangeinfoBtn">儲存</button>
        <button id="leaveChangeinfoBtn">離開</button>
      </div>
    </div>
    <div id="allText">
    </div>
    <script type="module" src="che.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
  </body>
</html>
